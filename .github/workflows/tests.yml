name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r dashboard/requirements-extraction.txt
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=.:dashboard python -m unittest discover -s dashboard -p 'test_*.py' -v
      - run: python scripts/audit_library.py --demo
