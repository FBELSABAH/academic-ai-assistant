<aside id="sidebar" aria-label="Main navigation"><div class="sidebar-head"><div class="brand"><span class="logo">a.</span><div>Academic</div></div><button id="sidebarToggle" aria-label="Hide navigation" aria-expanded="true" aria-controls="sidebar" title="Toggle navigation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div><div id="sidebarContents"><nav><button class="active" data-nav="overview"><span>▦</span>Overview</button><button data-nav="courses"><span>▤</span>My courses</button><button data-nav="calendar"><span>▦</span>Calendar</button><button data-nav="study"><span>✧</span>Study</button><button data-nav="library"><span>▱</span>File library</button></nav><div class="side-label">YOUR COURSES</div><div id="sideCourses"></div></div></aside>

<script>
const sidebar=document.getElementById('sidebar'),sidebarToggle=document.getElementById('sidebarToggle');
function setSidebar(open,remember=true){
 if(!open&&sidebar.contains(document.activeElement))sidebarToggle.focus();
 document.body.classList.toggle('sidebar-closed',!open);document.getElementById('sidebarContents').inert=!open;document.getElementById('sidebarContents').setAttribute('aria-hidden',String(!open));sidebarToggle.setAttribute('aria-expanded',String(open));sidebarToggle.setAttribute('aria-label',open?'Hide navigation':'Show navigation');
 if(remember)try{localStorage.setItem('academic-sidebar-open',String(open))}catch(e){}
}
let savedSidebar=null;try{savedSidebar=localStorage.getItem('academic-sidebar-open')}catch(e){}
setSidebar(savedSidebar===null?window.innerWidth>650:savedSidebar==='true',false);
sidebarToggle.onclick=()=>setSidebar(document.body.classList.contains('sidebar-closed'));
document.getElementById('sidebarBackdrop').onclick=()=>setSidebar(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]'))setSidebar(false)});
sidebar.addEventListener('click',e=>{if(window.innerWidth<=650&&e.target.closest('#sidebarContents button'))setSidebar(false)});
</script>
<script>
let courses=[],view='overview',selected=null,fileQuery='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fileURL=(c,f)=>'/file?course='+c.id+'&path='+encodeURIComponent(f.path);
function modal(title,html){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=html;document.getElementById('dialog').showModal()}
function courseCards(){return '<div class="courses">'+courses.map(c=>`<button class="course ${c.color}" onclick="showCourse('${c.id}')"><div class="course-code">${c.code} <span style="float:right">↗</span></div><h3>${c.name}</h3><footer><span>${c.files.length} saved files</span><span>View course →</span></footer></button>`).join('')+'</div>'}
function fileRows(items){return items.length?items.map(({c,f})=>`<div class="file"><span class="file-icon">${esc(f.name.split('.').pop().toUpperCase())}</span><div><div class="file-name">${esc(f.name)}</div><small>${c.code} · ${(f.size/1024/1024).toFixed(1)} MB · ${f.current?'Downloaded':'Needs verification'}</small></div><a class="open" href="${fileURL(c,f)}" target="_blank" rel="noopener">Open ↗</a></div>`).join(''):'<div class="empty">No files match your search.</div>'}
function filterFiles(value){fileQuery=value;const query=value.toLowerCase();document.getElementById('fileResults').innerHTML=fileRows(allFiles().filter(({c,f})=>(c.code+' '+c.name+' '+f.name+' '+f.title).toLowerCase().includes(query)))}
function allFiles(){return courses.flatMap(c=>c.files.map(f=>({c,f})))}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));let content='';const n=allFiles().length;
if(view==='overview'){document.getElementById('crumb').textContent='Overview';content=`<div class="intro"><div><div class="eyebrow">YOUR FALL SEMESTER, AT A GLANCE</div><h1>A clearer week ahead.</h1><p>Everything you need to find your next step.</p></div><button class="primary" onclick="startUpdate(false)">Update Moodle</button></div><div class="stats"><button class="stat stat-link" onclick="navigate('courses')"><label>Your semester</label><strong>${courses.length} courses</strong><small>Fall 2026 · University of PEI</small></button><button class="stat stat-link" onclick="navigate('library')"><label>Ready to open</label><strong>${n} files</strong><small>Saved in your course library</small></button><div class="stat"><label>Last Moodle check</label><strong id="updateStatus">Loading…</strong><small id="lastChecked"></small></div></div><section id="syncPanel" class="sync-panel" hidden></section><div class="columns"><section class="card" id="assessmentsPanel"><h2>Upcoming dates</h2><p>Loading…</p></section><section class="card" id="changesPanel"></section></div>`}

else if(view==='courses'){document.getElementById('crumb').textContent='My courses';content=`<div class="intro"><div><h1>Courses</h1></div></div>${courseCards()}`}
else if(view==='course'){let c=courses.find(c=>c.id===selected);document.getElementById('crumb').textContent=c.code;content=`<div class="intro"><div><button class="textbutton back" onclick="navigate('courses')">← All courses</button><div class="eyebrow">${c.code} · FALL 2026</div><h1>${c.name}</h1><p>${c.files.length} downloaded files</p></div></div><div class="course-actions"><button class="primary" onclick="openCourseFolder('${c.id}',this)">Open course folder</button><a href="${esc(c.url)}" target="_blank" rel="noopener">Open course in Moodle ↗</a><span role="status" class="folder-feedback"></span></div><div class="card files"><h2>Course materials</h2>${fileRows(c.files.map(f=>({c,f})))}</div>`}
else{document.getElementById('crumb').textContent='File library';const query=fileQuery.toLowerCase();content=`<div class="intro"><div><h1>Files</h1></div></div><input class="search library-search" type="search" aria-label="Search course files" placeholder="Search filenames or courses" value="${esc(fileQuery)}" oninput="filterFiles(this.value)"><div class="card" id="fileResults">${fileRows(allFiles().filter(({c,f})=>(c.code+' '+c.name+' '+f.name+' '+f.title).toLowerCase().includes(query)))}</div>`}
document.getElementById('content').innerHTML=content}
function navigate(v){view=v;fileQuery='';render();animatePage();window.scrollTo(0,0)}function showCourse(id){selected=id;view='course';render();animatePage();window.scrollTo(0,0)}
function animatePage(){
 const content=document.getElementById('content');
 content.getAnimations().forEach(animation=>animation.cancel());
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)
  content.animate([{opacity:.55,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.2,.7,.2,1)'});
}
async function openCourseFolder(id,button){
 const feedback=button.parentElement.querySelector('.folder-feedback');
 button.disabled=true;feedback.textContent='';
 try{
  if(!dashboardToken)await status();
  const response=await fetch('/api/course-folder/'+encodeURIComponent(id),{method:'POST',headers:{'X-Dashboard-Token':dashboardToken}});
  if(response.status===404)throw Error('Reopen Academic Assistant.app to enable folder access.');
  const result=await response.json();if(!response.ok)throw Error(result.error||'Could not open folder.');
  feedback.textContent='Opened in Finder';
 }catch(error){feedback.textContent=error.message}
 finally{button.disabled=false}
}
async function load(){let r=await fetch('/api/library');if(!r.ok)throw Error('Unable to read library');courses=await r.json();document.getElementById('sideCourses').innerHTML=courses.map(c=>`<button class="side-course ${c.color}" data-course="${c.id}" onclick="showCourse('${c.id}')"><span class="dot"></span>${c.code}</button>`).join('');render()}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));load().catch(()=>{document.getElementById('content').innerHTML='<div class="empty">Could not load your saved library. Reopen Academic Assistant to try again.</div>'});
</script>
<style>.sync-panel{border:1px solid var(--line);background:white;border-radius:12px;padding:20px;margin:0 0 24px}.sync-panel progress{width:100%;height:7px;accent-color:var(--green);margin-top:14px}.sync-panel p{font-size:12px}.sync-panel .actions{display:flex;gap:16px;align-items:center;margin-top:12px}.sync-panel ul{padding-left:18px;font-size:12px;line-height:1.8;color:var(--muted)}button:disabled{opacity:.6;cursor:wait}.change-item{padding:9px 0;border-top:1px solid var(--line);font-size:12px}.change-item small{display:block;color:var(--muted);margin-top:4px}</style>
<script>
let syncState={status:'idle'},dashboardToken='',polling=false;
const originalRender=render;
const dateLabel=s=>s?new Date(s).toLocaleString('en-CA',{timeZone:'America/Halifax',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Not yet checked';
render=function(){originalRender();decorate()};
function decorate(){
 if(view!=='overview')return;
 const active=['running','connecting','busy'].includes(syncState.status);
 const failed=['partial','login_required','error','interrupted'].includes(syncState.status);
 const intro=document.querySelector('.intro .primary');if(intro){intro.textContent=active?'Updating…':'Update Moodle';intro.disabled=active}
 const checked=document.getElementById('lastChecked');if(checked)checked.textContent=active?'Checking Moodle…':syncState.finished_at?`${failed?'Last attempt':'Last checked'} ${dateLabel(syncState.finished_at)}`:'Not checked yet';
 const updateLabel=document.getElementById('updateStatus');if(updateLabel)updateLabel.textContent=active?'Updating…':failed?'Needs attention':syncState.status==='complete'?'Complete':'Ready';
 const panel=document.getElementById('syncPanel');if(!panel)return;
 panel.hidden=!active&&!failed;
 if(active){
  delete panel.dataset.failure;
  if(!panel.querySelector('.sync-track'))panel.innerHTML='<p role="status"></p><div class="sync-track" role="progressbar" aria-label="Moodle course update"><span></span></div>';
  panel.querySelector('p').textContent=syncState.message||'Checking courses…';
  const track=panel.querySelector('.sync-track');
  const total=Number(syncState.total)||0,done=Math.min(total,Math.max(0,Number(syncState.completed)||0));
  track.classList.toggle('indeterminate',!total);
  if(total){track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax',total);track.setAttribute('aria-valuenow',done);track.setAttribute('aria-valuetext',`${done} of ${total} courses checked`);track.firstElementChild.style.transform=`scaleX(${done/total})`}
  else{['aria-valuemin','aria-valuemax','aria-valuenow','aria-valuetext'].forEach(name=>track.removeAttribute(name));track.firstElementChild.style.transform=''}
 }else if(failed){
  const signature=JSON.stringify(syncState);
  if(panel.dataset.failure!==signature){panel.dataset.failure=signature;panel.innerHTML=`<p role="status">${esc(syncState.message||'Update needs attention')}</p><button class="textbutton" onclick="startUpdate(${syncState.status==='login_required'})">${syncState.status==='login_required'?'Sign in to Moodle':'Retry update'}</button><details><summary>Update details</summary><ul>${(syncState.courses||[]).map(c=>`<li>${esc(c.name)} · ${esc(c.status)}</li>`).join('')}</ul></details>`}
 }else{panel.replaceChildren();delete panel.dataset.failure}

 const changes=document.getElementById('changesPanel');if(!changes)return;
 const history=(syncState.change_history||syncState.changes||[]).slice().reverse();
 const row=c=>`<div class="change-item"><span class="tag">${c.kind==='new'?'New':'Updated'}</span> ${esc(c.name)}${c.source?.startsWith('https://moodle31.upei.ca/')?` <a href="${esc(c.source)}" target="_blank" rel="noopener" aria-label="Open ${esc(c.name)} in Moodle">↗</a>`:''}<small>${esc(courses.find(course=>course.id===c.course_id)?.code||c.course)}${c.observed_at?' · Found '+esc(dateLabel(c.observed_at)):''}</small></div>`;
 const signature=JSON.stringify([history,syncState.status,syncState.changes?.length]);
 if(changes.dataset.signature!==signature){changes.dataset.signature=signature;changes.innerHTML='<div class="section-title"><h2>Recent changes</h2></div>'+(!active&&syncState.status==='complete'&&!syncState.changes?.length?'<p class="change-note">No new changes in the last check.</p>':'')+(history.length?history.slice(0,5).map(row).join('')+(history.length>5?`<details class="coverage"><summary>Earlier changes (${history.length-5})</summary>${history.slice(5).map(row).join('')}</details>`:''):'<p>No changes yet.</p>')}
}
async function status(){if(polling)return;polling=true;try{const r=await fetch('/api/status');if(!r.ok)throw Error('status');const next=await r.json();const finished=['running','connecting'].includes(syncState.status)&&!['running','connecting'].includes(next.status);syncState=next;dashboardToken=next.token;decorate();if(finished)await load()}catch(e){const p=document.getElementById('syncPanel');if(p){p.hidden=false;p.innerHTML='<h2>Dashboard disconnected</h2><p>Reopen Academic Assistant using its launcher, then reload this page. Saved files are safe.</p>'}}finally{polling=false}}
async function startUpdate(reconnect){try{if(!dashboardToken)await status();const r=await fetch(reconnect?'/api/reconnect':'/api/sync',{method:'POST',headers:{'X-Dashboard-Token':dashboardToken}});if(![202,409].includes(r.status))throw Error('start');syncState=await r.json();decorate()}catch(e){modal('Could not start update','<p>Reload this page and try again. If it still cannot connect, reopen the app using its launcher.</p>')}}
status();setInterval(status,2000);
</script>
<style>.assessment-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.assessment-tabs button{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--green);font-size:11px}.assessment-tabs button.active{background:#e8efe2}.evidence{border-left:3px solid #c3d4bb;padding:10px 12px;margin:10px 0;background:#f6f7f2;font-size:12px;line-height:1.6}dialog{max-height:85vh;overflow:auto}.coverage{margin-top:18px;font-size:12px;color:var(--muted)}.coverage li{margin-bottom:6px}</style>
<script>
let assessmentData=null,assessmentFilter='week',assessmentBusy=false,assessmentSync=null;
const previousDecorate=decorate;
decorate=function(){previousDecorate();paintAssessments()};
function paintAssessments(){
 if(view!=='overview')return;
 const panel=document.getElementById('assessmentsPanel');if(!panel)return;
 const choices=[['week','This week'],['month','Next 30 days'],['review','Needs review'],['all','All dates']];
 let html='<div class="section-title"><h2>Upcoming dates</h2></div><div class="assessment-tabs">'+choices.map(([id,label])=>`<button class="${assessmentFilter===id?'active':''}" onclick="assessmentFilter='${id}';paintAssessments()">${label}</button>`).join('')+'</div>';
 if(!assessmentData){panel.innerHTML=html+'<p>Loading dates…</p>';return}
 if(assessmentData.error){panel.innerHTML=html+'<p>'+esc(assessmentData.error)+'</p>';return}
 const period=assessmentData.period;const end=new Date(period.today+'T12:00:00');end.setDate(end.getDate()+30);const endKey=end.toLocaleDateString('en-CA');
 const signature=JSON.stringify([assessmentFilter,assessmentData.generated_at,assessmentData.calendar_checked_at,assessmentData.user_revision,period,courses.length]);if(panel.dataset.assessmentSignature===signature)return;panel.dataset.assessmentSignature=signature;
 const recurring=e=>!e.date&&e.title==='Recurring pop quizzes';
 const events=assessmentData.events.filter(e=>assessmentFilter==='all'||assessmentFilter==='review'&&(e.review||e.tentative||!e.date)||assessmentFilter==='week'&&(e.date>=period.start&&e.date<=period.end||recurring(e))||assessmentFilter==='month'&&(e.date>=period.today&&e.date<=endKey||recurring(e)));
 html+=`<p style="font-size:11px;margin-bottom:12px">${assessmentFilter==='week'?esc(period.start)+' – '+esc(period.end):'Saved dates'} · ${events.length} entries</p>`;
 html+=events.length?events.map(e=>{let c=courses.find(c=>c.id===e.course_id);let date=e.date?new Date(e.date+'T12:00:00'):null;return `<div class="event"><div class="date">${date?date.toLocaleDateString('en-CA',{month:'short'}).toUpperCase():'DATE'}<b>${date?date.getDate():'?'}</b></div><button onclick="showAssessment('${e.id}')"><span class="course-code ${c?.color||''}">${esc(c?.code||e.course)}</span><h3>${esc(e.display_title||e.title)} <span class="pill ${e.kind==='Practice'?'practice':''}">${esc(e.kind)}</span></h3><p>${e.cancelled?'Cancelled in Moodle':e.start_at?esc(dateLabel(e.start_at))+' · Moodle calendar':e.conflict_dates?'⚠ Conflicting source dates':e.tentative?'Tentative schedule':e.review?'Needs review':'View source'} · ${e.sources.length} source${e.sources.length===1?'':'s'} ↗</p></button></div>`}).join(''):'<p>No dates found in saved sources for this view.</p>';
 const problems=assessmentData.coverage.filter(c=>c.status!=='Text analyzed');
 html+=`<details class="coverage"><summary>Source coverage · ${problems.length} need review</summary><p>${assessmentData.coverage.length-problems.length} sources read. These sources may contain dates the app could not read.</p><ul>${problems.map(p=>`<li>${esc(p.name)} — ${esc(p.status)}</li>`).join('')}</ul></details>`;
 if(assessmentData.changes?.length)html+='<details class="coverage"><summary>Date changes</summary>'+assessmentData.changes.map(c=>`<div class="evidence"><b>${esc(courses.find(course=>course.id===c.course_id)?.code||c.course_id)} · ${esc(c.title)}</b><br>${esc(c.before.join(', ')||'Not previously found')} → ${esc(c.after.join(', '))}</div>`).join('')+'</details>';
 panel.innerHTML=html;
 if(typeof paintCalendar==='function')paintCalendar();
}
function showAssessment(id){const e=assessmentData.events.find(e=>e.id===id);if(!e)return;modal(e.title,`<p><b>${esc(e.course)}</b><br>${e.date?esc(e.date):'No fixed date found'} · ${esc(e.kind)}</p>${e.conflict_dates?`<p>⚠ Other sources list ${esc(e.conflict_dates.join(', '))}. Verify with the instructor or Moodle before relying on this date.</p>`:''}${e.tentative?'<p>The source describes this schedule as tentative.</p>':''}<p>Submission: ${esc(e.submission_status)}. ${esc(e.time_note||'Times are not inferred from the class schedule.')}</p>${e.sources.map(s=>`<div class="evidence">${esc(s.evidence)}<br><a href="${esc(s.file_url)}${s.page&&s.name.toLowerCase().endsWith('.pdf')?'#page='+s.page:''}" target="_blank" rel="noopener">${esc(s.name)}${s.page?' · page/slide '+s.page:''} ↗</a> · <a href="${esc(s.url)}" target="_blank" rel="noopener">Moodle ↗</a></div>`).join('')}`)}
async function loadAssessments(){if(assessmentBusy)return;assessmentBusy=true;try{const r=await fetch('/api/assessments');if(!r.ok)throw Error('not available');assessmentData=await r.json()}catch(e){assessmentData={error:'Reopen Academic Assistant.app to load the new assessment feed. Your saved course files are unaffected.'}}finally{assessmentBusy=false;paintAssessments()}}
loadAssessments();setInterval(()=>{if(!['running','connecting'].includes(syncState.status)&&syncState.finished_at!==assessmentSync){assessmentSync=syncState.finished_at;loadAssessments()}},3000);
</script>
