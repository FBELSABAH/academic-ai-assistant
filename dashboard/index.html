font:800 34px Manrope,sans-serif;letter-spacing:-1.3px;margin:5px 0 9px}p{color:var(--muted);line-height:1.6;margin:0}button.primary{background:var(--green);color:#fff;border:0;border-radius:9px;padding:13px 19px;font-weight:600}.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--green);font-weight:700}.notice{padding:11px 16px;background:#edf0e7;border:1px solid #dde4d6;border-radius:9px;color:#64725b;font-size:12px;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:27px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:20px 23px}.stat label{font-size:12px;color:var(--muted)}.stat strong{font:800 29px Manrope;display:block;margin:9px 0 4px}.stat small{color:var(--muted);font-size:11px}.columns{display:grid;grid-template-columns:1.55fr 1fr;gap:24px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h2{font:800 17px Manrope;margin:0}.tag{font-size:10px;padding:5px 8px;background:#f0f2ed;color:#788174;border-radius:5px}.event{display:flex;align-items:flex-start;gap:16px;padding:19px 0;border-top:1px solid #edf0e9}.date{background:#f1f4ed;min-width:49px;text-align:center;border-radius:8px;padding:8px 0;font-size:9px;color:var(--muted)}.date b{font:800 21px Manrope;display:block;color:var(--ink);margin-top:3px}.event h3{font-size:14px;margin:6px 0}.event p{font-size:12px}.event button{border:0;background:none;text-align:left;padding:0;color:inherit}.pill{font-size:10px;border-radius:4px;padding:3px 6px;background:#f7eee7;color:#a7744c}.pill.practice{background:#edf1f9;color:#627baf}.focus{background:#e8efe2;padding:24px;border-radius:13px;position:relative;margin-bottom:18px}.focus h2{font-size:20px;margin:12px 0}.focus p{color:#627360;font-size:13px}.focus .symbol{font-size:26px}.focus button{background:none;border:0;color:#3e6647;padding:16px 0 0;font-weight:700}.status-row{padding:12px 0;display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #eef0eb}.status-row span{color:var(--muted)}.course-heading{margin:30px 0 17px;display:flex;align-items:center;justify-content:space-between}.textbutton{border:0;background:none;color:var(--green);font-size:12px;font-weight:600}.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.course{border:1px solid var(--line);border-radius:12px;padding:20px;background:#fff;text-align:left;color:inherit;transition:transform .15s,box-shadow .15s}.course:hover{transform:translateY(-3px);box-shadow:0 6px 18px #203a360a}.course-code{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.7px}.course h3{font:700 15px Manrope;line-height:1.5;margin:11px 0 7px;min-height:44px}.course p{font-size:11px}.course footer{margin-top:22px;padding-top:13px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.coral{--accent:#b97562}.blue{--accent:#698cae}.purple{--accent:#9582b7}.gold{--accent:#b59a4f}.green{--accent:#62957c}.files{margin-top:20px}.file{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line)}.file-icon{background:#edf1ea;border-radius:7px;padding:10px;font-size:10px;color:var(--green);min-width:47px;text-align:center}.file-name{font-weight:600;font-size:13px;overflow-wrap:anywhere}.file small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.file a.open{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--green)}.back{margin-bottom:20px}dialog{border:1px solid var(--line);border-radius:15px;padding:30px;max-width:500px;width:90%;color:var(--ink);box-shadow:0 25px 100px #203a362e}dialog::backdrop{background:#1c302f66}dialog p{margin:16px 0}dialog button{float:right}dialog a{color:var(--green)}.empty{padding:32px;color:var(--muted)}.bottom-note{text-align:center;font-size:11px;color:#8b968c;margin-top:30px}.toast{position:fixed;bottom:25px;right:25px;padding:15px 22px;border-radius:10px;background:var(--ink);color:#fff;box-shadow:0 5px 30px #0002;z-index:5}a:focus-visible,button:focus-visible{outline:3px solid #8ab59b;outline-offset:3px}@media(min-width:1450px){.courses{grid-template-columns:repeat(5,1fr)}}@media(max-width:1000px){aside{width:185px;padding:25px 14px}main{margin-left:185px;padding:25px}.columns{grid-template-columns:1fr}.courses{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{position:static;width:auto;padding:15px}.brand{font-size:16px}.semester,.side-label,#sideCourses,.side-bottom{display:none}nav{display:flex;margin-top:12px}nav button{padding:10px;font-size:12px}main{margin:0;padding:20px}header{gap:15px}.search{width:180px}.intro{display:block;margin-top:25px}h1{font-size:29px}.intro .primary{margin-top:18px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:24px}.stat small{font-size:10px}.courses{grid-template-columns:1fr}.card{padding:20px}.breadcrumb{font-size:10px}}
.stat{min-width:0}.stat strong{font-size:clamp(19px,2.1vw,29px);overflow-wrap:normal}@media(max-width:400px){.stats{grid-template-columns:1fr}.stat strong{font-size:24px}.search{min-width:0;width:175px}header{gap:10px}}
</style></head><body>
<aside><div class="brand"><span class="logo">a.</span><div>Academic<small>Your university, together.</small></div></div><div class="semester">Fall 2026 <span>UPEI ↗</span></div><nav><button class="active" data-nav="overview"><span>▦</span>Overview</button><button data-nav="courses"><span>▤</span>My courses</button><button data-nav="library"><span>▱</span>File library</button></nav><div class="side-label">YOUR COURSES</div><div id="sideCourses"></div><div class="side-bottom">● &nbsp; Local preview<br>Your files stay on this Mac.</div></aside>
<main><header><div class="breadcrumb">My workspace &nbsp; / &nbsp; <b id="crumb">Overview</b></div><input class="search" id="search" type="search" aria-label="Search course files" placeholder="Search your course files…"></header><div id="content"></div><div class="bottom-note">Academic Assistant · A little less admin. A little more learning.</div></main><dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><button class="primary" onclick="document.getElementById('dialog').close()">Got it</button></dialog>
<script>
let courses=[],view='overview',selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fileURL=(c,f)=>'/file?course='+c.id+'&path='+encodeURIComponent(f.path);
function modal(title,html){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=html;document.getElementById('dialog').showModal()}
function courseCards(){return '<div class="courses">'+courses.map(c=>`<button class="course ${c.color}" onclick="showCourse('${c.id}')"><div class="course-code">${c.code} <span style="float:right">↗</span></div><h3>${c.name}</h3><p>${c.description}</p><footer><span>${c.files.length} saved files</span><span>View course →</span></footer></button>`).join('')+'</div>'}
function fileRows(items){return items.length?items.map(({c,f})=>`<div class="file"><span class="file-icon">${esc(f.name.split('.').pop().toUpperCase())}</span><div><div class="file-name">${esc(f.name)}</div><small>${c.code} · ${(f.size/1024/1024).toFixed(1)} MB · ${f.current?'Verified in saved sync':'Needs verification'}</small></div><a class="open" href="${fileURL(c,f)}" target="_blank" rel="noopener">Open ↗</a></div>`).join(''):'<div class="empty">No files match your search.</div>'}
function allFiles(){return courses.flatMap(c=>c.files.map(f=>({c,f})))}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));let content='';const n=allFiles().length;
if(view==='overview'){document.getElementById('crumb').textContent='Overview';content=`<div class="intro"><div><div class="eyebrow">YOUR FALL SEMESTER, AT A GLANCE</div><h1>A clearer week ahead.</h1><p>Everything you need to find your next step.</p></div><button class="primary" onclick="startUpdate(false)">↻ &nbsp; Update Moodle</button></div><div class="notice">Your saved course library and source-linked assessments.</div><div class="stats"><div class="stat"><label>Your semester</label><strong>${courses.length} courses</strong><small>Fall 2026 · University of PEI</small></div><div class="stat"><label>Ready to open</label><strong>${n} files</strong><small>Saved in your course library</small></div><div class="stat"><label>Moodle connection</label><strong>Saved snapshot</strong><small>Live updates are the next step</small></div></div><div class="columns"><section class="card"><h2>This week & beyond</h2><p>Loading source-linked assessments…</p></section><div><section class="focus"><div class="symbol">✳</div><div class="eyebrow" style="margin-top:12px">LESS SEARCHING, MORE STUDYING</div><h2>Your course files. All here.</h2><p>Open a lecture, find an assignment, or pick up where you left off. No digging through five Moodle pages.</p><button onclick="navigate('library')">Explore your library →</button></section><section class="card"><h2>Your setup</h2><div class="status-row">Course downloads <span>Available</span></div><div class="status-row">Automatic assessment tracking <span>Next milestone</span></div><div class="status-row">Calendar & reminders <span>Not connected</span></div></section></div></div><div class="course-heading"><h2>My courses</h2><button class="textbutton" onclick="navigate('courses')">See all courses →</button></div>${courseCards()}`}
else if(view==='courses'){document.getElementById('crumb').textContent='My courses';content=`<div class="intro"><div><div class="eyebrow">FALL 2026</div><h1>Your courses.</h1><p>One home for the material you need.</p></div></div>${courseCards()}`}
else if(view==='course'){let c=courses.find(c=>c.id===selected);document.getElementById('crumb').textContent=c.code;content=`<div class="intro"><div><button class="textbutton back" onclick="navigate('courses')">← All courses</button><div class="eyebrow">${c.code} · FALL 2026</div><h1>${c.name}</h1><p>${c.files.length} downloaded files · Saved Moodle snapshot</p></div></div><a href="${esc(c.url)}" target="_blank" rel="noopener">Open course in Moodle ↗</a><div class="card files"><h2>Course materials</h2>${fileRows(c.files.map(f=>({c,f})))}</div>`}
else{document.getElementById('crumb').textContent='File library';const query=document.getElementById('search').value.toLowerCase();content=`<div class="intro"><div><div class="eyebrow">YOUR STUDY MATERIAL</div><h1>Find it. Open it. Study.</h1><p>Search filenames or course codes above. These are your actual downloaded files.</p></div></div><div class="card">${fileRows(allFiles().filter(({c,f})=>(c.code+' '+c.name+' '+f.name+' '+f.title).toLowerCase().includes(query)))}</div>`}
document.getElementById('content').innerHTML=content}
function navigate(v){view=v;document.getElementById('search').value='';render();window.scrollTo(0,0)}function showCourse(id){selected=id;view='course';render();window.scrollTo(0,0)}
async function load(){let r=await fetch('/api/library');if(!r.ok)throw Error('Unable to read library');courses=await r.json();document.getElementById('sideCourses').innerHTML=courses.map(c=>`<button class="side-course ${c.color}" onclick="showCourse('${c.id}')"><span class="dot"></span>${c.code}</button>`).join('');render()}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));document.getElementById('search').addEventListener('input',()=>{view='library';render()});load().catch(()=>{document.getElementById('content').innerHTML='<div class="empty">Could not load your saved library. Restart the demo to try again.</div>'});
</script>
<style>.sync-panel{border:1px solid var(--line);background:white;border-radius:12px;padding:20px;margin:0 0 24px}.sync-panel progress{width:100%;height:7px;accent-color:var(--green);margin-top:14px}.sync-panel p{font-size:12px}.sync-panel .actions{display:flex;gap:16px;align-items:center;margin-top:12px}.sync-panel ul{padding-left:18px;font-size:12px;line-height:1.8;color:var(--muted)}button:disabled{opacity:.6;cursor:wait}.change-item{padding:9px 0;border-top:1px solid var(--line);font-size:12px}.change-item small{display:block;color:var(--muted);margin-top:4px}</style>
<script>
let syncState={status:'idle'},dashboardToken='',polling=false;
const originalRender=render;
const dateLabel=s=>s?new Date(s).toLocaleString('en-CA',{timeZone:'America/Halifax',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Not yet checked';
render=function(){originalRender();decorate()};
function decorate(){
 if(view!=='overview')return;
 const intro=document.querySelector('.intro .primary');if(intro){intro.textContent='↻  Update Moodle';intro.onclick=()=>startUpdate(false);intro.disabled=['running','connecting'].includes(syncState.status)}
 const notice=document.querySelector('.notice');if(notice)notice.textContent='Your real course library · Assessment cards below remain curated examples. Automatic assessment extraction and calendar reminders are not connected yet.';
 const stats=document.querySelectorAll('.stat');if(stats[2]){stats[2].querySelector('label').textContent='Last dashboard update';stats[2].querySelector('strong').textContent=({complete:'Up to date',partial:'Partial update',running:'Updating…',connecting:'Sign in',login_required:'Reconnect',error:'Retry needed',interrupted:'Interrupted',busy:'Already running'})[syncState.status]||'Ready to sync';stats[2].querySelector('small').textContent=syncState.finished_at?dateLabel(syncState.finished_at)+' · '+syncState.status:'Saved library available';}
 let panel=document.getElementById('syncPanel');if(!panel){panel=document.createElement('section');panel.id='syncPanel';panel.className='sync-panel';document.querySelector('.stats').after(panel)}
 const active=['running','connecting'].includes(syncState.status);
 panel.innerHTML=`<div class="section-title"><h2>${active?'Updating your university':'Moodle updates'}</h2><span class="tag">${esc(syncState.status.replace('_',' ').toUpperCase())}</span></div><p>${esc(syncState.message||'Update all five courses and their organized folders with one click.')}</p>${active?`<progress ${syncState.total?`value="${syncState.completed||0}" max="${syncState.total}"`:''}></progress>`:''}${(syncState.courses||[]).length?'<ul>'+syncState.courses.map(c=>`<li>${esc(c.name)} — ${esc(c.status)}${c.verified!==undefined?`, ${c.verified} files checked`:''}${c.recorded_only?` · ${c.recorded_only} interactive/external links recorded only`:''}</li>`).join('')+'</ul>':''}<div class="actions"><button class="textbutton" onclick="startUpdate(true)" ${active?'disabled':''}>Reconnect Moodle</button><button class="textbutton" onclick="explainSync()">How updates work</button></div>`;
 let changes=document.getElementById('changesPanel');if(!changes){changes=document.createElement('section');changes.id='changesPanel';changes.className='sync-panel';panel.after(changes)}
 const history=syncState.change_history||syncState.changes||[];
 changes.innerHTML='<div class="section-title"><h2>Recent Moodle changes</h2><span class="tag">SAVED HISTORY</span></div><p style="margin-bottom:12px">'+(active?'Checking Moodle… Earlier findings stay here.':syncState.status==='complete'?(syncState.changes||[]).length+' new or changed files in the latest update. Earlier findings are kept.':'Earlier findings are kept even if an update is interrupted.')+'</p>'+(history.length?history.slice(-100).reverse().map(c=>`<div class="change-item"><b>${esc(c.kind.toUpperCase())}</b> · ${esc(c.name)}<small>${esc(c.course)}${c.observed_at?' · Found '+esc(dateLabel(c.observed_at)):''}</small></div>`).join('')+(history.length>100?'<p>Showing the latest 100 of '+history.length+' recorded changes.</p>':''):'<p>No changes recorded yet. Previously overwritten update summaries cannot be recovered automatically.</p>');
}
function explainSync(){modal('Update from Moodle','<p>This checks your Fall 2026 courses, downloads new or changed materials, and updates your University Courses folders. Existing personal files and previous versions are preserved.</p><p>If Moodle needs a fresh session, the app automatically opens its saved browser profile and attempts Microsoft sign-in. Complete verification only if Microsoft asks. You can also choose Reconnect Moodle at any time. The update continues automatically after sign-in.</p><p>Open Academic Assistant.app for normal use. Keep your Mac awake during the update. Assessment extraction, calendar reminders, and background scheduling are still upcoming features.</p>')}
async function status(){if(polling)return;polling=true;try{const r=await fetch('/api/status');if(!r.ok)throw Error('status');const next=await r.json();const finished=['running','connecting'].includes(syncState.status)&&!['running','connecting'].includes(next.status);syncState=next;dashboardToken=next.token;decorate();if(finished)await load()}catch(e){const p=document.getElementById('syncPanel');if(p)p.innerHTML='<h2>Dashboard disconnected</h2><p>Reopen Academic Assistant using its launcher, then reload this page. Saved files are safe.</p>'}finally{polling=false}}
async function startUpdate(reconnect){try{if(!dashboardToken)await status();const r=await fetch(reconnect?'/api/reconnect':'/api/sync',{method:'POST',headers:{'X-Dashboard-Token':dashboardToken}});if(![202,409].includes(r.status))throw Error('start');syncState=await r.json();decorate()}catch(e){modal('Could not start update','<p>Reload this page and try again. If it still cannot connect, reopen the app using its launcher.</p>')}}
status();setInterval(status,2000);
</script>
<style>.assessment-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.assessment-tabs button{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--green);font-size:11px}.assessment-tabs button.active{background:#e8efe2}.evidence{border-left:3px solid #c3d4bb;padding:10px 12px;margin:10px 0;background:#f6f7f2;font-size:12px;line-height:1.6}dialog{max-height:85vh;overflow:auto}.coverage{margin-top:18px;font-size:12px;color:var(--muted)}.coverage li{margin-bottom:6px}</style>
<script>
let assessmentData=null,assessmentFilter='week',assessmentBusy=false,assessmentSync=null;
const previousDecorate=decorate;
decorate=function(){previousDecorate();paintAssessments()};
function paintAssessments(){
 if(view!=='overview')return;
 const panel=document.querySelector('.columns > section.card');if(!panel)return;
 const notice=document.querySelector('.notice');if(notice)notice.textContent='Automatic source-linked assessment feed · Check tentative dates and flagged conflicts. Unreadable documents, announcements, and in-class changes may contain additional assessments.';
 const choices=[['week','This week'],['month','Next 30 days'],['review','Needs checking'],['all','All dates']];
 let html='<div class="section-title"><h2>This week & beyond</h2><span class="tag">FROM YOUR MATERIALS</span></div><div class="assessment-tabs">'+choices.map(([id,label])=>`<button class="${assessmentFilter===id?'active':''}" onclick="assessmentFilter='${id}';paintAssessments()">${label}</button>`).join('')+'</div>';
 if(!assessmentData){panel.innerHTML=html+'<p>Reading saved course information…</p>';return}
 if(assessmentData.error){panel.innerHTML=html+'<p>'+esc(assessmentData.error)+'</p>';return}
 const period=assessmentData.period;const end=new Date(period.today+'T12:00:00');end.setDate(end.getDate()+30);const endKey=end.toLocaleDateString('en-CA');
 const signature=JSON.stringify([assessmentFilter,assessmentData.generated_at,assessmentData.user_revision,period,courses.length]);if(panel.dataset.assessmentSignature===signature)return;panel.dataset.assessmentSignature=signature;
 const recurring=e=>!e.date&&e.title==='Recurring pop quizzes';
 const events=assessmentData.events.filter(e=>assessmentFilter==='all'||assessmentFilter==='review'&&(e.review||e.tentative||!e.date)||assessmentFilter==='week'&&(e.date>=period.start&&e.date<=period.end||recurring(e))||assessmentFilter==='month'&&(e.date>=period.today&&e.date<=endKey||recurring(e)));
 html+=`<p style="font-size:11px;margin-bottom:12px">${assessmentFilter==='week'?esc(period.start)+' – '+esc(period.end):'Dates as written in course sources'} · ${events.length} entries</p>`;
 html+=events.length?events.map(e=>{let c=courses.find(c=>c.id===e.course_id);let date=e.date?new Date(e.date+'T12:00:00'):null;return `<div class="event"><div class="date">${date?date.toLocaleDateString('en-CA',{month:'short'}).toUpperCase():'DATE'}<b>${date?date.getDate():'?'}</b></div><button onclick="showAssessment('${e.id}')"><span class="course-code ${c?.color||''}">${esc(c?.code||e.course)}</span><h3>${esc(e.title)} <span class="pill ${e.kind==='Practice'?'practice':''}">${esc(e.kind)}</span></h3><p>${e.conflict_dates?'⚠ Conflicting source dates':e.tentative?'Tentative schedule':e.review?'Check source details':'Date found in source'} · ${e.sources.length} source excerpt${e.sources.length===1?'':'s'} ↗</p></button></div>`}).join(''):'<p>No dated entries found for this view. This does not establish that no assessments are scheduled.</p>';
 const problems=assessmentData.coverage.filter(c=>c.status!=='Text analyzed');
 html+=`<details class="coverage"><summary>Extraction coverage · ${assessmentData.coverage.length-problems.length} readable sources · ${problems.length} skipped or needing review</summary><p>Automatic rules can miss dates. Scanned/handwritten pages need visual review. Submission status is unknown unless an explicit course practice policy applies.</p><ul>${problems.map(p=>`<li>${esc(p.name)} — ${esc(p.status)}</li>`).join('')}</ul></details>`;
 if(assessmentData.changes?.length)html+='<details class="coverage"><summary>Assessment changes since previous extraction</summary>'+assessmentData.changes.map(c=>`<div class="evidence"><b>${esc(courses.find(course=>course.id===c.course_id)?.code||c.course_id)} · ${esc(c.title)}</b><br>${esc(c.before.join(', ')||'Not previously found')} → ${esc(c.after.join(', '))}</div>`).join('')+'</details>';
 panel.innerHTML=html;
 const setup=document.querySelector('.columns > div .card');if(setup)setup.innerHTML='<h2>Your setup</h2><div class="status-row">Course downloads <span>Available</span></div><div class="status-row">Assessment extraction <span>Source-linked rules</span></div><div class="status-row">Calendar & reminders <span>Not connected</span></div>';
}
function showAssessment(id){const e=assessmentData.events.find(e=>e.id===id);if(!e)return;modal(e.title,`<p><b>${esc(e.course)}</b><br>${e.date?esc(e.date):'No fixed date found'} · ${esc(e.kind)}</p>${e.conflict_dates?`<p>⚠ Other sources list ${esc(e.conflict_dates.join(', '))}. Verify with the instructor or Moodle before relying on this date.</p>`:''}${e.tentative?'<p>The source describes this schedule as tentative.</p>':''}<p>Submission: ${esc(e.submission_status)}. ${esc(e.time_note||'Times are not inferred from the class schedule.')}</p>${e.sources.map(s=>`<div class="evidence">${esc(s.evidence)}<br><a href="${esc(s.file_url)}${s.page&&s.name.toLowerCase().endsWith('.pdf')?'#page='+s.page:''}" target="_blank" rel="noopener">${esc(s.name)}${s.page?' · page/slide '+s.page:''} ↗</a> · <a href="${esc(s.url)}" target="_blank" rel="noopener">Moodle ↗</a></div>`).join('')}`)}
async function loadAssessments(){if(assessmentBusy)return;assessmentBusy=true;try{const r=await fetch('/api/assessments');if(!r.ok)throw Error('not available');assessmentData=await r.json()}catch(e){assessmentData={error:'Reopen Academic Assistant.app to load the new assessment feed. Your saved course files are unaffected.'}}finally{assessmentBusy=false;paintAssessments()}}
loadAssessments();setInterval(()=>{if(!['running','connecting'].includes(syncState.status)&&syncState.finished_at!==assessmentSync){assessmentSync=syncState.finished_at;loadAssessments()}},3000);
</script>
<style>#chatToggle{position:fixed;right:24px;bottom:22px;border:0;border-radius:30px;padding:15px 22px;background:var(--green);color:white;box-shadow:0 5px 25px #203a3630;z-index:20;font-weight:700}#chatBox{position:fixed;right:24px;bottom:85px;width:min(430px,calc(100vw - 30px));height:min(610px,75vh);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 65px #203a362b;z-index:20;display:flex;flex-direction:column;padding:18px}#chatBox[hidden]{display:none}#chatLog{overflow:auto;flex:1;padding:10px 0}.bubble{padding:12px;border-radius:10px;background:#f0f4ed;margin:8px 0;white-space:pre-wrap;font-size:13px;line-height:1.6}.bubble.user{background:#e2eee8;margin-left:28px}.chat-actions{display:flex;gap:8px;margin-top:8px}.chat-actions button{border:1px solid var(--line);border-radius:7px;padding:7px 12px;color:var(--green);background:white}#chatForm{display:flex;gap:7px;margin-top:10px}#chatInput{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px}#chatBox .section-title{margin-bottom:5px}</style>
<button id="chatToggle" aria-expanded="false" aria-controls="chatBox">Chat with your planner</button>
<section id="chatBox" aria-label="Academic planner chat" hidden><div class="section-title"><h2>Your planner</h2><button class="textbutton" id="chatClose" aria-label="Close planner chat">Close</button></div><p style="font-size:11px">Local schedule commands · previews before changes · Undo available</p><div id="chatLog" role="log" aria-live="polite"></div><div class="chat-actions"><button id="chatWeek">This week</button><button id="chatExample">Add an assessment</button><button id="chatUndo">Undo last change</button></div><form id="chatForm"><input id="chatInput" aria-label="Message your planner" maxlength="1000" placeholder="Confirm Concept Deck is due October 8"><button class="primary" id="chatSend" type="submit">Send</button></form></section>
<script>
let chatBusy=false;
function chatOpen(open){document.getElementById('chatBox').hidden=!open;document.getElementById('chatToggle').setAttribute('aria-expanded',String(open));if(open)document.getElementById('chatInput').focus()}
document.getElementById('chatToggle').onclick=()=>chatOpen(document.getElementById('chatBox').hidden);document.getElementById('chatClose').onclick=()=>chatOpen(false);
function bubble(text,user=false){const div=document.createElement('div');div.className='bubble'+(user?' user':'');div.textContent=text;document.getElementById('chatLog').append(div);div.scrollIntoView({block:'nearest'});return div}
async function sendChat(payload,preview){if(chatBusy)return;chatBusy=true;document.getElementById('chatSend').disabled=true;if(payload.message)bubble(payload.message,true);try{if(!dashboardToken)await status();const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Dashboard-Token':dashboardToken},body:JSON.stringify(payload)});if(!r.ok)throw Error('Request failed');const result=await r.json();if(preview)preview.querySelectorAll('button').forEach(b=>b.disabled=true);const div=bubble(result.message);if(result.proposal){const actions=document.createElement('div');actions.className='chat-actions';for(const [label,field] of [['Confirm change','confirm'],['Cancel','cancel']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>sendChat({[field]:result.proposal},div);actions.append(b)}div.append(actions)}if(result.changed){await loadAssessments();await status()}if(result.undo_available){const b=document.createElement('button');b.className='textbutton';b.textContent='Undo latest change';b.onclick=()=>sendChat({undo:true},div);div.append(b)}const log=document.getElementById('chatLog');log.scrollTop=log.scrollHeight;}catch(e){bubble('Could not reach planner chat. Reopen Academic Assistant.app to load the update, then retry. Check the dashboard before repeating a change.')}finally{chatBusy=false;document.getElementById('chatSend').disabled=false}}
document.getElementById('chatForm').onsubmit=e=>{e.preventDefault();const input=document.getElementById('chatInput');const message=input.value.trim();if(message&&!chatBusy){input.value='';sendChat({message})}};
document.getElementById('chatWeek').onclick=()=>sendChat({message:'What do I have this week?'});document.getElementById('chatUndo').onclick=()=>sendChat({undo:true});document.getElementById('chatExample').onclick=()=>{document.getElementById('chatInput').value='Add STAT 2910 quiz this Friday';document.getElementById('chatInput').focus()};
bubble('Ask what is coming up, or tell me a course, assessment, and date.\nExamples:\n• What do I have this week?\n• Add STAT 2910 quiz this Friday\n• Confirm Concept Deck is due October 8\n\nI handle a small set of schedule commands—not general tutoring. No messages are sent to an external AI service.');
const showSourceAssessment=showAssessment;
showAssessment=function(id){showSourceAssessment(id);const e=assessmentData.events.find(e=>e.id===id);if(e?.confirmed_by_user){const p=document.createElement('p');p.textContent=(e.source_changed?'Source changed since your confirmation—please review. ':'')+'Confirmed by you. '+(e.user_note||'');document.getElementById('dialogBody').prepend(p)}};
const oldPaint=paintAssessments;
paintAssessments=function(){oldPaint();if(view==='overview'&&assessmentData?.events){for(const e of assessmentData.events.filter(e=>e.confirmed_by_user)){const b=document.querySelector('[onclick="showAssessment(\''+e.id+'\')"]');if(b){const p=b.querySelector('p');if(p)p.textContent=e.source_changed?'Source changed · Needs checking ↗':'Confirmed by you ↗'}}}};
</script></body></html>
